services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afro
      POSTGRES_PASSWORD: afro
      POSTGRES_DB: afro_salon
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
volumes:
  dbdata:
